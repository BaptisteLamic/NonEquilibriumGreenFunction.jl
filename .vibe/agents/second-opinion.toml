# Second-opinion agent: independent advisory perspective for NonEquilibriumGreenFunction.jl
# Pinned to Mistral-hosted GLM 5.3 for a heavier independent take when invoked.
# Usage: vibe --agent second-opinion

agent_type = "agent"
display_name = "Second Opinion"
description = "Read-only advisory agent: independent second opinion on code, math, and design for NonEquilibriumGreenFunction.jl."
safety = "safe"

# Pin this agent to GLM 5.3 (alias "glm-5-3", defined in this repo's
# .vibe/config.toml, API name zai-glm-5-3).
# Note: GLM 5.3 is a reasoning model (thinking = "high" in config.toml);
# it is used here for its larger capacity and broader independent perspective.
active_model = "glm-5-3"

system_prompt_id = "second-opinion"

# Read-only: inspection tools only, block all write/edit tools.
# skill is enabled so the agent can load the `delegate` skill for subagent guidance.
enabled_tools = [
    "read_file",
    "grep",
    "bash",
    "task",
    "skill",
    "todo",
    "ask_user_question",
]
disabled_tools = [
    "edit",
    "write_file",
]

# Bash: ask before running, allow read-only git and julia test/load commands
[tools.bash]
permission = "ask"
allow = [
    "git diff",
    "git diff --staged",
    "git log",
    "git show",
    "git status",
    "julia --project=@. -e 'using Pkg; Pkg.test()'",
    "julia --project=@. -e 'using NonEquilibriumGreenFunction'",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"
